<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장바구니 검수관 · 상품 링크</title>
<meta name="description" content="릴스에 나온 상품 링크를 번호로 찾아보세요.">
<style>
:root{--y:#FFC400;--ink:#141418;--bg:#FFF8E1;--card:#fff;--mut:#6b6b73;--line:#eee2b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{background:var(--y);padding:28px 16px 22px;text-align:center;border-bottom:4px solid var(--ink)}
header h1{font-size:24px;font-weight:900;letter-spacing:-.5px}
header p{font-size:14px;margin-top:4px;font-weight:600}
.ad{max-width:560px;margin:14px auto 0;padding:0 16px;font-size:12px;color:var(--mut);line-height:1.5}
.search{max-width:560px;margin:14px auto 4px;padding:0 16px}
.search input{width:100%;font-size:16px;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff}
main{max-width:560px;margin:0 auto;padding:10px 16px 40px;display:grid;gap:12px}
a.card{display:grid;grid-template-columns:auto 84px 1fr;gap:12px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px;text-decoration:none;color:inherit;box-shadow:3px 3px 0 var(--ink)}
a.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.no{width:40px;height:40px;border-radius:50%;background:var(--y);border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:15px}
.img{width:84px;height:84px;border-radius:10px;object-fit:cover;background:#f3f3f3}
.t{font-size:15px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{margin-top:6px;font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.price{color:var(--ink);font-weight:800;font-size:15px}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--ink);color:#fff}
.tag.toss{background:#3182f6}
.empty{text-align:center;color:var(--mut);padding:30px 0}
footer{text-align:center;font-size:12px;color:var(--mut);padding:0 16px 30px}
</style></head><body>
<header><h1>🛒 장바구니 검수관</h1><p>릴스 속 상품, 번호로 찾으세요</p></header>
<p class="ad">[광고] 이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
<div class="search"><input id="q" type="search" placeholder="번호나 상품명으로 검색" inputmode="search"></div>
<main><a class="card" href="https://link.coupang.com/a/h8Lr52fsl2" target="_blank" rel="sponsored noopener" data-s="2 스프라이트 제로 사이다 with tea"><div class="no">2</div><img class="img" src="https://image7.coupangcdn.com/image/retail/images/2026/05/19/18/1/b5de012e-d332-49ab-9be4-5e6b00896427.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"><div><div class="t">스프라이트 제로 사이다 with TEA</div><div class="m"><span class="tag coupang">쿠팡</span><span class="price">15,050원</span></div></div></a>
<a class="card" href="https://link.coupang.com/a/h8LpepRVCK" target="_blank" rel="sponsored noopener" data-s="1 하이플러스 스마트 하이패스 자동 충전카드"><div class="no">1</div><img class="img" src="https://img2a.coupangcdn.com/image/retail/images/2025/07/16/15/6/6b5fcafc-69ea-4111-8aa2-7f84234a2d64.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"><div><div class="t">하이플러스 스마트 하이패스 자동 충전카드</div><div class="m"><span class="tag coupang">쿠팡</span><span class="price">6,000원</span></div></div></a></main>
<footer>※ 가격·할인은 영상 제작 시점 기준이며 바뀔 수 있어요.<br>업데이트 2026-10-25</footer>
<script>
const q=document.getElementById('q');q&&q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();
document.querySelectorAll('a.card').forEach(c=>{c.style.display=!v||c.dataset.s.includes(v)?'':'none'})});
</script></body></html>
